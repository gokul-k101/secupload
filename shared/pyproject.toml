[project]
name = "sih-shared"
version = "0.1.0"
description = "Shared protocol, crypto, credential-state, framing and TLS primitives for SI-H"
requires-python = ">=3.11"
dependencies = ["cryptography>=44.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sih_shared"]
