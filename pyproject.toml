[project]
name = "sih"
version = "0.1.0"
description = "Dual-tunnel secure proxy workspace (shared, server, client, proxy)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["shared", "server", "client", "proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP007"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
